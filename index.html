<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Planner Coach</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    form {
      max-width: 500px;
      margin: 0 auto 20px auto;
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background: #2ecc71;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #27ae60;
    }
    ul.task-list {
      list-style: none;
      max-width: 500px;
      margin: 0 auto;
      padding: 0;
    }
    ul.task-list li {
      background: #fff;
      margin-bottom: 5px;
      border: 1px solid #ddd;
      padding: 10px;
      display: flex;
      flex-direction: column;
      border-radius: 4px;
    }
    ul.task-list li > div {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    ul.task-list li span.task-text {
      flex-grow: 1;
      cursor: pointer;
    }
    ul.task-list li span.task-text.completed {
      text-decoration: line-through;
      color: #888;
    }
    ul.task-list li span.reminder {
      font-size: 0.9em;
      color: #555;
      margin-top: 5px;
    }
    ul.task-list li button {
      background: #e74c3c;
      margin-top: 5px;
      padding: 5px 10px;
      font-size: 0.9em;
      align-self: flex-end;
    }
    ul.task-list li button:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <h1>Garden Planner Coach</h1>
  <form id="taskForm">
    <input type="text" id="taskInput" placeholder="Enter a custom task (optional)" >
    <input type="datetime-local" id="reminderInput" title="Set a reminder for this task (optional)">
    <button type="submit">Add Task</button>
  </form>
  
  <ul id="taskList" class="task-list"></ul>
  
  <script>
    // Pre-populated tasks for the garden program, starting April 14th.
    // Each task includes a description and a reminder time.
    const presetTasks = [
      {
        text: "Step 1: Clear the garden bed. Remove all weeds, old roots, stones, and debris.",
        reminder: "2025-04-14T09:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 2: Loosen and aerate the soil to about 8-12 inches deep (use a spade, large spoon, or sturdy fork).",
        reminder: "2025-04-14T10:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 3: Mix in homemade soil boosters. Dig small trenches to bury chopped fruit/veg scraps, coffee grounds, and crushed eggshells.",
        reminder: "2025-04-14T11:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 4: Plant the cherry tomato. At one end of the bed, dig a hole, set your tomato seedling (bury the stem up to the first set of true leaves), and backfill. Provide support with a stake or cage.",
        reminder: "2025-04-15T09:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 5: Plant the bush beans. In the middle of the bed, draw a shallow furrow and sow bean seeds 1 inch deep, spaced about 15 cm apart.",
        reminder: "2025-04-15T14:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 6: Plant the broccoli. At the opposite end of the bed from the tomato, dig a hole and set your broccoli seedling (or sow seeds lightly).",
        reminder: "2025-04-16T09:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 7: Water thoroughly. Give your garden a deep watering to settle the soil around your plants.",
        reminder: "2025-04-16T10:00", 
        completed: false,
        notified: false
      },
      {
        text: "Step 8: Ongoing care. Starting April 17th, check daily for watering needs, support the tomato, and monitor for pests (e.g., snails, aphids, caterpillars).",
        reminder: "2025-04-17T08:00", 
        completed: false,
        notified: false
      }
    ];

    // Retrieve tasks from local storage or initialize with preset tasks.
    let tasks = JSON.parse(localStorage.getItem("tasks"));
    if (!tasks || tasks.length === 0) {
      tasks = presetTasks;
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }
    
    // Save tasks to local storage.
    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }
    
    // Display tasks on the page.
    function displayTasks() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");

        // Container for task text and completion toggle.
        const div = document.createElement("div");

        const span = document.createElement("span");
        span.textContent = task.text;
        span.className = "task-text" + (task.completed ? " completed" : "");
        span.addEventListener("click", () => {
          tasks[index].completed = !tasks[index].completed;
          saveTasks();
          displayTasks();
        });
        div.appendChild(span);
        
        li.appendChild(div);

        if (task.reminder) {
          const rspan = document.createElement("span");
          rspan.className = "reminder";
          const dt = new Date(task.reminder);
          rspan.textContent = "Reminder: " + dt.toLocaleString();
          li.appendChild(rspan);
        }
        
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete Task";
        delBtn.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          displayTasks();
        });
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }
    
    // Event listener for adding a custom task.
    document.getElementById("taskForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const taskInput = document.getElementById("taskInput");
      const reminderInput = document.getElementById("reminderInput");
      if (taskInput.value.trim() !== "") {
        const newTask = {
          text: taskInput.value,
          reminder: reminderInput.value || null,
          completed: false,
          notified: false
        };
        tasks.push(newTask);
        saveTasks();
        displayTasks();
        taskInput.value = "";
        reminderInput.value = "";
      }
    });
    
    displayTasks();
    
    // Check for upcoming reminders every 10 seconds.
    setInterval(() => {
      const now = new Date();
      tasks.forEach((task, index) => {
        if(task.reminder && !task.notified) {
          const reminderTime = new Date(task.reminder);
          // Trigger a notification if the reminder is due within the next minute.
          if(reminderTime - now < 60000 && reminderTime - now > 0) {
            alert("Reminder: " + task.text);
            tasks[index].notified = true;
            saveTasks();
          }
        }
      });
    }, 10000);
  </script>
</body>
</html>
